<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mail Dispatch · 예약 메일</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#202638;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e7ec;padding:24px max(24px,calc((100vw - 1120px)/2))}header b{font-size:25px;letter-spacing:-1px}header span{color:#d95519;font-size:12px;margin-left:12px;font-weight:700}main{max-width:1168px;margin:32px auto;padding:0 24px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 8px}.lead{color:#687080;margin:0 0 28px;line-height:1.6}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px}.card{background:#fff;border:1px solid #e2e5eb;border-radius:16px;padding:24px;align-self:start}h2{font-size:18px;margin:0 0 22px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cfd5df;border-radius:8px;font:inherit;font-size:14px}textarea{resize:vertical;min-height:110px}button{border:0;border-radius:8px;padding:11px 15px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;background:#edf0f5;color:#303747}button.primary{width:100%;margin-top:20px;background:#ef641f;color:#fff}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.toolbar select{max-width:190px}.list{display:grid;gap:12px}.job{border:1px solid #e6e9ed;padding:16px;border-radius:10px}.job h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}.job p{font-size:12px;color:#677182;margin:5px 0;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:11px;white-space:nowrap;font-weight:700;padding:5px 8px;border-radius:20px;background:#edf1f8}.badge.SMTP_ACCEPTED{background:#e6f5ec;color:#1b7546}.badge.FAILED{background:#fdeaea;color:#b42e32}.badge.RETRY_WAIT{background:#fff0df;color:#a25406}.actions{margin-top:12px;display:flex;gap:8px}.actions button{padding:7px 10px;font-size:12px}.empty{padding:40px 10px;text-align:center;color:#768093;font-size:14px}.notice{font-size:12px;line-height:1.6;color:#737b89;margin-top:14px}.message{font-size:13px;line-height:1.6;margin:14px 0 0;min-height:20px}.error{color:#b8332f}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px}.attempt{font-size:12px;background:#f5f6f8;padding:10px;margin-top:10px;line-height:1.8}a{color:#ba4813}footer{margin:24px 0;color:#7d8490;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.card{padding:20px}main{padding:0 16px}.row{align-items:start}header{padding:20px}}
</style></head><body><header><b>Mail Dispatch</b><span>PORTFOLIO DEMO</span></header><main><h1>예약 메일을 한곳에서</h1><p class="lead">발송 시간을 정하고, 처리 상태와 재시도 이력을 확인하세요.</p><div class="layout"><section class="card"><h2>새 메일 예약</h2><form id="form"><label for="recipient">받는 사람</label><input id="recipient" type="email" value="recipient@example.test" maxlength="254" required><label for="subject">제목</label><input id="subject" maxlength="200" value="예약 발송 테스트" required><label for="body">내용</label><textarea id="body" maxlength="20000" required>안녕하세요. 예약 메일 발송을 확인합니다.</textarea><label for="scheduledAt">발송 시간 · 현재 기기 시간 기준</label><input id="scheduledAt" type="datetime-local" step="1" required><button class="primary" id="submit">메일 예약하기</button></form><p class="message" id="message" role="status"></p><p class="notice">로컬 테스트 수신함을 사용하는 데모입니다. 기본 설정에서는 외부 이메일 주소로 전달되지 않습니다. <a href="http://127.0.0.1:8025" target="_blank" rel="noopener">테스트 수신함 열기</a></p></section><section class="card"><h2>발송 요청</h2><div class="toolbar"><select id="filter" aria-label="처리 상태 필터"><option value="">전체 상태</option><option value="PENDING">예약 대기</option><option value="PROCESSING">처리 중</option><option value="SMTP_ACCEPTED">메일 서버 전달 완료</option><option value="RETRY_WAIT">재시도 대기</option><option value="FAILED">실패</option><option value="CANCELLED">취소</option></select><button id="refresh">새로고침</button></div><div id="list" class="list"></div><p id="list-error" class="message error" role="alert"></p><div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div><p class="notice">메일 서버 전달 완료는 SMTP 서버가 메일을 접수했다는 뜻이며, 실제 받은편지함 도착을 보장하지 않습니다.</p></section></div><footer>Mail Dispatch · Java / Spring Boot · 로컬 포트폴리오 프로젝트</footer></main>
<script>
const $=id=>document.getElementById(id),labels={PENDING:'예약 대기',PROCESSING:'처리 중',SMTP_ACCEPTED:'메일 서버 전달 완료',RETRY_WAIT:'재시도 대기',FAILED:'실패',CANCELLED:'취소'};
let page=0,key=crypto.randomUUID();const t=new Date(Date.now()+60000);$('scheduledAt').value=new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,19);
const fmt=s=>s?new Date(s).toLocaleString('ko-KR'):'-';
async function api(path,options={}){const r=await fetch(path,options);const data=await r.json();if(!r.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data;}
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
$('form').addEventListener('input',()=>key=crypto.randomUUID());
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').className='message';try{await api('/api/mails',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({recipient:$('recipient').value,subject:$('subject').value,body:$('body').value,scheduledAt:new Date($('scheduledAt').value).toISOString()})});$('message').textContent='예약이 등록되었습니다. 발송 요청 목록에서 상태를 확인하세요.';key=crypto.randomUUID();page=0;await load();}catch(err){$('message').className='message error';$('message').textContent=err.message;}finally{$('submit').disabled=false;}};
async function load(){try{const data=await api('/api/mails?page='+page+'&size=5'+($('filter').value?'&status='+$('filter').value:''));$('list').replaceChildren();$('list-error').textContent='';if(!data.items.length)$('list').append(node('div','등록된 발송 요청이 없습니다.','empty'));for(const j of data.items){const card=node('article','','job'),row=node('div','','row'),info=node('div','');info.append(node('h3',j.subject),node('p',j.recipient));row.append(info,node('span',labels[j.status]||j.status,'badge '+j.status));card.append(row,node('p','예약 '+fmt(j.scheduledAt)),node('p','발송 시도 '+j.attemptCount+'회'));if(j.status==='RETRY_WAIT')card.append(node('p','다음 시도 '+fmt(j.nextAttemptAt)));const actions=node('div','','actions'),history=node('button','시도 이력');history.onclick=async()=>{try{const rows=await api('/api/mails/'+j.id+'/attempts');card.querySelector('.attempt')?.remove();card.append(node('div',rows.length?rows.map(a=>a.attemptNo+'회 · '+fmt(a.startedAt)+' · '+(labels[a.outcome]||a.outcome)+(a.errorCode?' · '+a.errorCode:'')).join('\n'):'아직 발송 시도가 없습니다.','attempt'));}catch(e){$('list-error').textContent=e.message;}};actions.append(history);if(['PENDING','RETRY_WAIT'].includes(j.status)){const cancel=node('button','예약 취소');cancel.onclick=async()=>{try{await api('/api/mails/'+j.id+'/cancel',{method:'POST'});await load();}catch(e){$('list-error').textContent=e.message;}};actions.append(cancel);}card.append(actions);$('list').append(card);}$('page').textContent=(page+1)+' 페이지';$('prev').disabled=page===0;$('next').disabled=!data.hasNext;}catch(e){$('list-error').textContent=e.message;}}
$('refresh').onclick=load;$('filter').onchange=()=>{page=0;load();};$('prev').onclick=()=>{page--;load();};$('next').onclick=()=>{page++;load();};load();
</script></body></html>
