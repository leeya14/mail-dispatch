spring.application.name=mail-dispatch
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/maildispatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:portfolio@example.test}
app.worker.enabled=${WORKER_ENABLED:true}
app.worker.delay-ms=${WORKER_DELAY_MS:2000}
app.retry.base-seconds=${RETRY_BASE_SECONDS:30}
app.retry.max-attempts=3
